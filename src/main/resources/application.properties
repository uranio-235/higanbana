spring.application.name=higanbana
app.chunks.analysis-window-chars=5000
spring.config.import=optional:file:./application-local.properties
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.same-site=strict
spring.datasource.url=jdbc:duckdb:./higanbana.duckdb;threads=4;async_threads=4
spring.datasource.driver-class-name=org.duckdb.DuckDBDriver
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=db/changelog/db.changelog-master.xml
spring.liquibase.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/duckdb/schema.sql
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.tomcat.max-http-form-post-size=21MB
server.tomcat.max-swallow-size=-1

# Real text provider; keep its credential in the ignored application-local.properties.
app.text-mode=nvidia
app.text.model=nvidia/nemotron-3.5-lightning-30b-a3b
app.nvidia.base-url=https://integrate.api.nvidia.com
app.nvidia.api-key=
app.nvidia.connect-timeout=10s
app.nvidia.read-timeout=300s
app.ai.cache.ttl=30d
app.memory.onnx-path=${HIGANBANA_MEMORY_ONNX:./memory-model/model.onnx}
app.memory.tokenizer-path=${HIGANBANA_MEMORY_TOKENIZER:./memory-model/tokenizer.json}

# Reserved for a future image adapter; images are currently uploaded by the user.
app.image.model=
app.manga-dir=./data/manga