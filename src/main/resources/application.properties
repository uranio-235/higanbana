spring.application.name=higanbana
spring.config.import=optional:file:./application-local.properties
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.same-site=strict
spring.datasource.url=jdbc:sqlite:./higanbana.db?foreign_keys=on&busy_timeout=10000&journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.tomcat.max-http-form-post-size=3MB

# Text mode: demo or nvidia. Model is used only in nvidia mode.
app.text-mode=demo
app.text.model=mistralai/mistral-large-4-1t-a52b
app.nvidia.base-url=https://integrate.api.nvidia.com
app.nvidia.api-key=

# Reserved for the future image adapter; images are currently always demo.
app.image.model=
app.manga-dir=./data/manga